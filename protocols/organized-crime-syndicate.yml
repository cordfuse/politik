# Organized Crime / Syndicate — Ephemeral protocol (no record, ever; Boss decides).
# A governance archetype for completeness of the taxonomy, not an endorsement.
# Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: organized-crime-syndicate
  version: 1.0.0
  mode: ephemeral
  record_mode: ephemeral
  roles:
    AUTHORITY: Boss
    DELEGATE: Underboss
    OPERATOR: Capo
    MEMBER: Soldier
    OBSERVER: Associate
  primitives:
    SESSION: Job
    CHARTER: The Code
    MOTION: Order
    EXIT: Whacked
    DEADLOCK: War
  domain_veto: []
  no_escalation: true
  no_record: true
  immutable_charter: false
