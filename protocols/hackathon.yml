# Hackathon — Darwinist protocol (the clock governs; judges score).
# Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: hackathon
  version: 1.0.0
  mode: darwinist
  record_mode: anchored
  roles:
    AUTHORITY: Organizer
    DELEGATE: Judge Panel Chair
    OPERATOR: Team Lead
    MEMBER: Hacker
    OBSERVER: Sponsor
  primitives:
    SESSION: Hackathon
    CHARTER: Hackathon Rules
    RECORD: Submission Log
    MOTION: Build
    DIVISION: Judge Score
    ESCALATION: Mentor Consultation
    SUSPENSION: Time's Up
    EXIT: Withdrew
    DEADLOCK: Tie
  domain_veto: []
  no_escalation: false
  no_record: false
  immutable_charter: false
