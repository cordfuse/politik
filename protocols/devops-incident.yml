# DevOps / Incident — Authoritarian protocol.
# The Incident Commander decides unilaterally under pressure; the timeline is the
# anchored record. Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: devops-incident
  version: 1.0.0
  mode: authoritarian
  record_mode: anchored
  roles:
    AUTHORITY: Incident Commander
    DELEGATE: Operations Lead
    OPERATOR: On-Call Engineer
    MEMBER: Responder
    OBSERVER: Stakeholder
  primitives:
    SESSION: Incident
    CHARTER: Runbook
    RECORD: Incident Timeline
    MOTION: Remediation Action
    DIVISION: Team Consensus
    ESCALATION: Escalate to IC
    SUSPENSION: Incident Resolved
    EXIT: Handed Off
    DEADLOCK: Bridge Call Chaos
  domain_veto: []
  no_escalation: false
  no_record: false
  immutable_charter: false
