# League Season — constitutional sports protocol.
# Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: league-season
  version: 1.0.0
  mode: constitutional
  record_mode: anchored

  roles:
    AUTHORITY: Commissioner
    DELEGATE: League Director
    OPERATOR: Team Captain
    MEMBER: Roster Player
    OBSERVER: Fan / Press

  primitives:
    SESSION: Season
    PROCEEDING: Season
    CHARTER: Rulebook
    RECORD: Season Stats
    MOTION: Play Call
    DIVISION: Referee Decision
    ESCALATION: Challenge Flag
    SUSPENSION: Off Season
    QUORUM: Minimum Roster
    DEADLOCK: Tie — Overtime
    ASSENT: Result Confirmed
    EXIT: Traded / Released

  domain_veto: []
  no_escalation: false
  no_record: false
  immutable_charter: false
