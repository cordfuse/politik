# Open Source / RFC — Constitutional protocol.
# A maintainer (BDFL) holds a soft veto; the community comments before a merge.
# Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: open-source-rfc
  version: 1.0.0
  mode: constitutional
  record_mode: distributed
  roles:
    AUTHORITY: Maintainer
    DELEGATE: Core Contributor
    OPERATOR: Contributor
    MEMBER: Community Member
    OBSERVER: Watcher
  primitives:
    SESSION: RFC Period
    CHARTER: CONTRIBUTING.md
    RECORD: PR History
    MOTION: RFC
    DIVISION: Maintainer Approval
    ESCALATION: Request for Comment
    SUSPENSION: RFC Closed
    EXIT: Removed
    DEADLOCK: Stalled RFC
  domain_veto: []
  no_escalation: false
  no_record: false
  immutable_charter: false
