# Clinical / Hospital — Constitutional protocol; the Patient holds a treatment veto.
# Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: clinical-hospital
  version: 1.0.0
  mode: constitutional
  record_mode: distributed
  roles:
    AUTHORITY: Attending
    DELEGATE: Charge Nurse
    OPERATOR: Specialist
    MEMBER: Resident
    OBSERVER: Patient
  primitives:
    SESSION: Case
    CHARTER: Clinical Protocol
    RECORD: Patient Chart
    MOTION: Treatment Order
    DIVISION: Multidisciplinary Team Vote
    ESCALATION: Ethics Consultation
    SUSPENSION: Discharge
    EXIT: Referred Out
    DEADLOCK: Ethics Committee Review
  domain_veto:
    - OBSERVER
  no_escalation: false
  no_record: false
  immutable_charter: false
