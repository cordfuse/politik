# eSports Match — Constitutional protocol.
# Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: esports-match
  version: 1.0.0
  mode: constitutional
  record_mode: distributed
  roles:
    AUTHORITY: Referee
    DELEGATE: Deputy Referee
    OPERATOR: Team Captain
    MEMBER: Player
    OBSERVER: Caster
  primitives:
    SESSION: Series
    CHARTER: Ruleset
    RECORD: Match History
    MOTION: In-game Call
    DIVISION: Admin Ruling
    ESCALATION: Admin Call
    SUSPENSION: Technical Pause
    EXIT: Forfeit
    DEADLOCK: Remake
  domain_veto: []
  no_escalation: false
  no_record: false
  immutable_charter: false
