# Replication Crisis — Darwinist protocol. A finding either survives replication
# or dies; no negotiation. Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: replication-crisis
  version: 1.0.0
  mode: darwinist
  record_mode: anchored
  roles:
    AUTHORITY: Replication Director
    DELEGATE: Meta-analyst Agent
    OPERATOR: Replication Agent
    MEMBER: Original Study Agent
    OBSERVER: Field Community
  primitives:
    SESSION: Replication Study
    CHARTER: Exact Replication Protocol
    RECORD: Replication Log
    MOTION: Experimental Run
    DIVISION: Replication Success or Failure Vote
    ESCALATION: Discrepancy Report
    SUSPENSION: Replication Report Published
    EXIT: Does Not Replicate
    DEADLOCK: Partial Replication
  domain_veto: []
  no_escalation: false
  no_record: false
  immutable_charter: false
