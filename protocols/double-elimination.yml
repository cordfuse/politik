# Double Elimination — Darwinist protocol.
# Single elimination with two survival chances; the field culls to a last
# standing. Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: double-elimination
  version: 1.0.0
  mode: darwinist
  record_mode: anchored
  roles:
    AUTHORITY: Tournament Director
    DELEGATE: Deputy Director
    OPERATOR: Team Captain
    MEMBER: Competitor
    OBSERVER: Spectator
  primitives:
    SESSION: Tournament
    CHARTER: Tournament Rules
    RECORD: Bracket
    MOTION: Match
    DIVISION: Match Result
    ESCALATION: Protest
    SUSPENSION: Bye Round
    EXIT: Eliminated
    DEADLOCK: Tiebreaker Round
  domain_veto: []
  no_escalation: false
  no_record: false
  immutable_charter: false
  mechanics:
    resolution: majority
    exit: elimination
    termination: last-standing
