# Investment / Trading — Constitutional protocol; the Risk Committee can block a trade.
# Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: investment-trading
  version: 1.0.0
  mode: constitutional
  record_mode: distributed
  roles:
    AUTHORITY: Portfolio Manager
    DELEGATE: Senior Analyst
    OPERATOR: Analyst
    MEMBER: Junior Analyst
    OBSERVER: Risk Committee
  primitives:
    SESSION: Investment Thesis
    CHARTER: Investment Policy Statement
    RECORD: Trade Log
    MOTION: Trade Recommendation
    DIVISION: Committee Vote
    ESCALATION: Risk Committee Override
    SUSPENSION: Market Close
    EXIT: Position Closed
  domain_veto:
    - OBSERVER
  no_escalation: false
  no_record: false
  immutable_charter: false
