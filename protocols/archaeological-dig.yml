# Archaeological Dig — Constitutional protocol; the Heritage Authority can halt the dig.
# Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: archaeological-dig
  version: 1.0.0
  mode: constitutional
  record_mode: distributed
  roles:
    AUTHORITY: Principal Archaeologist
    DELEGATE: Site Supervisor
    OPERATOR: Field Director
    MEMBER: Field Technician
    OBSERVER: Heritage Authority
  primitives:
    SESSION: Excavation Season
    CHARTER: Site Research Design
    RECORD: Site Archive
    MOTION: Excavation Decision
    DIVISION: Team Consensus
    ESCALATION: Heritage Authority Notification
    SUSPENSION: Season Close
    EXIT: Left Site
  domain_veto:
    - OBSERVER
  no_escalation: false
  no_record: false
  immutable_charter: false
