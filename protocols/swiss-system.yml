# Swiss System — Constitutional protocol.
# No elimination; standings accumulate over fixed rounds.
# NOTE: Swiss pairing (opponents matched by score) needs a `pairing` override
# point not yet built (ADR-0007) — ships with default mechanics for now.
# Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: swiss-system
  version: 1.0.0
  mode: constitutional
  record_mode: distributed
  roles:
    AUTHORITY: Arbiter
    DELEGATE: Deputy Arbiter
    OPERATOR: Team Captain
    MEMBER: Competitor
    OBSERVER: Spectator
  primitives:
    SESSION: Swiss Tournament
    CHARTER: Swiss Rules
    RECORD: Standings
    MOTION: Round
    DIVISION: Game Result
    ESCALATION: Arbiter Ruling Request
    SUSPENSION: Bye
    EXIT: Withdrawal
    DEADLOCK: Draw
  domain_veto: []
  no_escalation: false
  no_record: false
  immutable_charter: false
