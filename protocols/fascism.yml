# Fascism — Authoritarian protocol.
#
# No Division and no escalation: authority is terminal and routes back to the
# Leader. Recorded here as a governance archetype for completeness of the
# taxonomy, not an endorsement.
#
# Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: fascism
  version: 1.0.0
  mode: authoritarian
  record_mode: anchored

  roles:
    AUTHORITY: The Leader
    DELEGATE: Deputy
    OPERATOR: State Minister
    MEMBER: Party Member
    OBSERVER: Subject

  primitives:
    SESSION: The State
    RECORD: State Record
    MOTION: Decree
    EXIT: Purged

  domain_veto: []
  no_escalation: true
  no_record: false
  immutable_charter: false
