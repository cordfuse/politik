# Debate Competition — Constitutional protocol.
# Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: debate-competition
  version: 1.0.0
  mode: constitutional
  record_mode: distributed
  roles:
    AUTHORITY: Chief Adjudicator
    DELEGATE: Panel Chair
    OPERATOR: Adjudicator
    MEMBER: Debater
    OBSERVER: Audience
  primitives:
    SESSION: Tournament
    CHARTER: Debate Rules
    RECORD: Adjudication Notes
    MOTION: Resolution
    DIVISION: Adjudicator Decision
    ESCALATION: Chief Adjudicator Appeal
    SUSPENSION: Break
    EXIT: Eliminated
  domain_veto: []
  no_escalation: false
  no_record: false
  immutable_charter: false
