# Grand Challenge — Darwinist protocol. Teams compete in isolation; the Charter
# defines the problem completely before the session opens.
# Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: grand-challenge
  version: 1.0.0
  mode: darwinist
  record_mode: anchored
  roles:
    AUTHORITY: Prize Committee
    DELEGATE: Evaluation Lead
    OPERATOR: Team Lead Agent
    MEMBER: Team Member Agent
    OBSERVER: Scientific Community
  primitives:
    SESSION: Challenge Period
    CHARTER: Problem Definition
    RECORD: Leaderboard
    MOTION: Solution Submission
    DIVISION: Evaluation Committee Scoring
    ESCALATION: Submission Dispute
    SUSPENSION: Winner Declared
    EXIT: Disqualified
    DEADLOCK: No Valid Submission
  domain_veto: []
  no_escalation: false
  no_record: false
  immutable_charter: false
