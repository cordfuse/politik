# Academic / University — Constitutional protocol.
# Attribution: Steve Krisjanovs, Cordfuse
protocol:
  name: academic-university
  version: 1.0.0
  mode: constitutional
  record_mode: distributed
  roles:
    AUTHORITY: Dean
    DELEGATE: Faculty Lead
    OPERATOR: Professor
    MEMBER: Graduate Student
    OBSERVER: Undergraduate
  primitives:
    SESSION: Semester
    CHARTER: Academic Code
    RECORD: Academic Record
    MOTION: Research Task
    DIVISION: Faculty Vote
    ESCALATION: Academic Review Board
    SUSPENSION: End of Term
    EXIT: Expelled
    DEADLOCK: Committee Stalemate
  domain_veto: []
  no_escalation: false
  no_record: false
  immutable_charter: false
