name: CI

# Tests on this repo were run by hand for its entire history. On a public repo
# that is not verification — a contributor's PR, or a maintainer's own merge,
# could break everything silently.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor package.json declares; 22 is what CI would default to.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The published tarball shipped no protocol manifests for the whole of
      # Phase 5. Assert the library is actually in the package rather than
      # trusting the files list to stay correct.
      - name: The package must contain the protocol library
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const files = require('/tmp/pack.json')[0].files.map(f => f.path);
            const protocols = files.filter(f => f.startsWith('protocols/') && f.endsWith('.yml'));
            if (protocols.length < 10) {
              console.error('FAIL: package ships ' + protocols.length + ' protocol manifests, expected 10');
              process.exit(1);
            }
            if (!files.includes('bin/politik.js')) {
              console.error('FAIL: package ships no binary');
              process.exit(1);
            }
            console.log('OK: ' + protocols.length + ' protocols + binary in the package');
          "

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # A stranger's first five minutes: install the tarball somewhere that has
      # never seen this repo, then convene and govern a session.
      - name: Clean-room install and govern a session
        run: |
          set -e
          npm pack
          mkdir -p /tmp/clean && cd /tmp/clean
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/cordfuse-politik-*.tgz
          export PATH="/tmp/clean/node_modules/.bin:$PATH"

          git init -q session && cd session
          git config user.email ci@example.com && git config user.name CI

          politik doctor || true
          # A scripted session: CI has no terminal, so opt out of the Speaker's
          # confirmation (ADR-0010). The gate itself is checked further down.
          politik scaffold --out . --quorum 2 --speaker-confirmation off
          politik validate CHARTER.md
          # `politik init` commits the writ drop itself — standalone (git init)
          # or, as here where the dir is already a repo, into the enclosing repo
          # (ADR-0008 monorepo mode). No manual commit needed.
          politik init --charter CHARTER.md --speaker ci --out . --guid ci-001

          politik division call --motion motion-001 --actor ci --role AUTHORITY
          politik division vote --motion motion-001 --actor a --role OPERATOR --vote AYE
          politik division vote --motion motion-001 --actor b --role OPERATOR --vote AYE
          politik division tally --motion motion-001 --actor ci --role AUTHORITY
          politik assent --motion motion-001 --actor ci --role AUTHORITY
          politik status --dir .

          # ADR-0010 from an installed package: a default session stages an
          # assent requested without a terminal (exit 3) and records nothing.
          cd /tmp/clean
          politik new gated && cd gated
          git init -q . && git config user.email ci@example.com && git config user.name CI
          politik scaffold --dir . --quorum 1 >/dev/null
          politik init --charter CHARTER.md --speaker ci >/dev/null
          politik division call --motion m1 --actor ci --role AUTHORITY >/dev/null
          politik division vote --motion m1 --actor a --role MEMBER --vote AYE >/dev/null
          politik division tally --motion m1 >/dev/null
          set +e; politik assent --motion m1 --actor ci --role AUTHORITY; code=$?; set -e
          test "$code" -eq 3
          politik pending | grep -q 'assent-'
          if grep -q ASSENT_GRANTED HANSARD.md; then echo 'staged assent was recorded'; exit 1; fi

          # The protocol library must be reachable from an installed package.
          politik protocol lint /tmp/clean/node_modules/@cordfuse/politik/protocols/parliamentary.yml
