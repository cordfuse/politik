name: Release

# Push a version tag (e.g. v0.3.0) → this publishes @cordfuse/politik to npm.
# Requires the cordfuse org-level NPM_TOKEN secret to reach this repo (the org
# secret has selected-repo visibility; politik must be on its allow-list).

on:
  push:
    tags:
      - "v*"

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Guard — tag must match package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package version $PKG"; exit 1
          fi

      # Never publish a red build.
      - run: npm run lint
      - run: npm test

      - name: Assert token present
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is empty — add politik to the org NPM_TOKEN allow-list."; exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
